[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "llmd"
version = "0.1.0"
description = "Convert LLM chat exports to clean markdown"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
]

[project.scripts]
llmd = "llmd.cli:main"

[tool.setuptools.packages.find]
include = ["llmd*"]
